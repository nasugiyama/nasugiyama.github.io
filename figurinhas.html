<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Figurinhas Panini 2026</title>
  <style>
    :root {
      --green: #00703c;
      --green-dark: #005a30;
      --green-light: #e6f4ed;
      --gold: #f5c518;
      --gold-dark: #d4a800;
      --red: #e63946;
      --red-light: #fdecea;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --gray: #6b7280;
      --gray-light: #f3f4f6;
      --gray-border: #e5e7eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: white;
      padding: 1.25rem 1rem 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(0,0,0,.2);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 900px;
      margin: 0 auto;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .header-title .subtitle {
      font-size: .72rem;
      opacity: .7;
      font-weight: 400;
    }
    .ball-icon { font-size: 1.6rem; line-height: 1; }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      gap: .5rem;
      margin-top: .9rem;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      flex-wrap: wrap;
    }
    .stat-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,.15);
      border-radius: 8px;
      padding: .4rem .7rem;
      min-width: 60px;
      flex: 1;
      cursor: pointer;
      border: 2px solid transparent;
      transition: background .15s, border-color .15s;
    }
    .stat-chip:hover { background: rgba(255,255,255,.22); }
    .stat-chip.active { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.6); }
    .stat-chip .num { font-size: 1.4rem; font-weight: 700; line-height: 1.1; }
    .stat-chip .lbl { font-size: .58rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; margin-top: .1rem; }
    .stat-chip.c-miss .num { color: #fca5a5; }
    .stat-chip.c-have .num { color: #86efac; }
    .stat-chip.c-dup .num { color: var(--gold); }

    /* PROGRESS BAR */
    .progress-wrap {
      max-width: 900px;
      margin: .7rem auto 0;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .progress-bar-outer {
      flex: 1;
      height: 7px;
      background: rgba(255,255,255,.2);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      background: var(--gold);
      border-radius: 10px;
      transition: width .4s ease;
    }
    .progress-pct {
      font-size: .75rem;
      font-weight: 700;
      color: rgba(255,255,255,.9);
      min-width: 36px;
      text-align: right;
    }

    /* CONTROLS */
    .controls {
      max-width: 900px;
      margin: 0 auto;
      padding: .85rem 1rem;
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      flex: 1;
      min-width: 160px;
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: .7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      font-size: .9rem;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: .55rem .75rem .55rem 2.1rem;
      border: 1.5px solid var(--gray-border);
      border-radius: 8px;
      font-size: .9rem;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--green); }
    .search-input::placeholder { color: var(--text-muted); }

    .filter-tabs {
      display: flex;
      background: var(--gray-light);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .filter-tab {
      padding: .42rem .7rem;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }
    .filter-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .action-btns {
      display: flex;
      gap: .5rem;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray);
      font-size: 1rem;
      transition: border-color .15s, color .15s;
    }
    .icon-btn:hover { border-color: var(--green); color: var(--green); }

    /* COUNT LABEL */
    .count-label {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem .6rem;
      font-size: .78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* GRID */
    .grid-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 6px;
    }

    .sticker {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid var(--gray-border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: transform .1s, box-shadow .1s, background .15s, border-color .15s, color .15s;
      user-select: none;
      position: relative;
      -webkit-user-select: none;
    }
    .sticker:active { transform: scale(.92); }

    .sticker.have {
      background: var(--green-light);
      border-color: var(--green);
      color: var(--green-dark);
    }
    .sticker.have::after {
      content: '✓';
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: .55rem;
      color: var(--green);
      font-weight: 900;
    }

    .sticker.dup {
      background: #fffbeb;
      border-color: var(--gold-dark);
      color: #92400e;
    }
    .sticker.dup::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 4px;
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
    }
    .sticker.dup .dup-count {
      position: absolute;
      top: 1px;
      left: 4px;
      font-size: .52rem;
      color: var(--gold-dark);
      font-weight: 700;
    }

    .sticker.hidden { display: none; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      display: none;
    }
    .empty-state.visible { display: block; }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: .75rem; }
    .empty-state p { font-size: .9rem; }

    /* LEGEND */
    .legend {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem 1rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .75rem;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 2px solid;
      flex-shrink: 0;
    }
    .legend-dot.miss { background: var(--surface); border-color: var(--gray-border); }
    .legend-dot.have { background: var(--green-light); border-color: var(--green); }
    .legend-dot.dup { background: #fffbeb; border-color: var(--gold-dark); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      transform: translateY(100%);
      transition: transform .25s ease;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    .modal-sticker-num {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--green);
      text-align: center;
      margin-bottom: 1.2rem;
    }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
      margin-bottom: .75rem;
    }
    .modal-actions.three-col { grid-template-columns: 1fr 1fr 1fr; }
    .modal-btn {
      padding: .75rem .5rem;
      border-radius: 10px;
      border: 2px solid var(--gray-border);
      background: var(--gray-light);
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      text-align: center;
      color: var(--text);
    }
    .modal-btn.green { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
    .modal-btn.gold { background: #fffbeb; border-color: var(--gold-dark); color: #92400e; }
    .modal-btn.red { background: var(--red-light); border-color: var(--red); color: var(--red); }
    .modal-close {
      width: 100%;
      padding: .65rem;
      border-radius: 10px;
      border: none;
      background: var(--gray-light);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
    }

    /* DUP COUNTER */
    .dup-counter {
      display: flex;
      align-items: center;
      gap: .75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .dup-counter-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--gray-border);
      background: var(--gray-light);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }
    .dup-counter-val {
      font-size: 1.5rem;
      font-weight: 700;
      min-width: 40px;
      text-align: center;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2937;
      color: white;
      padding: .6rem 1.2rem;
      border-radius: 24px;
      font-size: .84rem;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* RESET CONFIRM */
    .reset-confirm {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .reset-confirm.open { display: flex; }
    .reset-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .reset-box h3 { font-size: 1rem; margin-bottom: .5rem; }
    .reset-box p { font-size: .85rem; color: var(--text-muted); margin-bottom: 1.2rem; line-height: 1.5; }
    .reset-btns { display: flex; gap: .6rem; }
    .reset-btns button {
      flex: 1;
      padding: .7rem;
      border-radius: 10px;
      border: none;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .reset-btns .cancel { background: var(--gray-light); color: var(--text-muted); }
    .reset-btns .confirm { background: var(--red); color: white; }

    @media (max-width: 480px) {
      .sticker-grid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; }
      .sticker { font-size: .72rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <div class="header-title">
      <span class="ball-icon">⚽</span>
      <div>
        <h1>Figurinhas Panini</h1>
        <div class="subtitle">Copa do Mundo 2026</div>
      </div>
    </div>
    <div style="display:flex;gap:.4rem">
      <button class="icon-btn" id="importBtn" title="Importar dados">📥</button>
      <button class="icon-btn" id="exportBtn" title="Exportar dados">📤</button>
      <button class="icon-btn" id="resetBtn" title="Resetar tudo" style="border-color:#fca5a5;color:#ef4444">🗑️</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-chip" data-filter="all" id="chipAll">
      <span class="num" id="statTotal">0</span>
      <span class="lbl">Total</span>
    </div>
    <div class="stat-chip c-have" data-filter="have" id="chipHave">
      <span class="num" id="statHave">0</span>
      <span class="lbl">Tenho</span>
    </div>
    <div class="stat-chip c-miss" data-filter="miss" id="chipMiss">
      <span class="num" id="statMiss">0</span>
      <span class="lbl">Falta</span>
    </div>
    <div class="stat-chip c-dup" data-filter="dup" id="chipDup">
      <span class="num" id="statDup">0</span>
      <span class="lbl">Repetidas</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
    </div>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="number" class="search-input" id="searchInput" placeholder="Buscar nº da figurinha..." min="1">
  </div>
  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all">Todas</button>
    <button class="filter-tab" data-filter="have">Tenho</button>
    <button class="filter-tab" data-filter="miss">Faltando</button>
    <button class="filter-tab" data-filter="dup">Repetidas</button>
  </div>
</div>

<div class="count-label" id="countLabel"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot miss"></div> Falta</div>
  <div class="legend-item"><div class="legend-dot have"></div> Tenho</div>
  <div class="legend-item"><div class="legend-dot dup"></div> Repetida <span style="font-size:.7rem;margin-left:2px">(número no canto)</span></div>
</div>

<!-- GRID -->
<div class="grid-container">
  <div class="sticker-grid" id="stickerGrid"></div>
  <div class="empty-state" id="emptyState">
    <div class="emoji">🔍</div>
    <p>Nenhuma figurinha encontrada com esse filtro.</p>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-sticker-num" id="modalNum">#1</div>
    <div id="modalContent"></div>
    <button class="modal-close" id="modalClose">Fechar</button>
  </div>
</div>

<!-- RESET CONFIRM -->
<div class="reset-confirm" id="resetConfirm">
  <div class="reset-box">
    <h3>Resetar tudo?</h3>
    <p>Todos os dados serão apagados. Essa ação não pode ser desfeita.</p>
    <div class="reset-btns">
      <button class="cancel" id="resetCancel">Cancelar</button>
      <button class="confirm" id="resetConfirmBtn">Resetar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
  const TOTAL = 728;
  const STORAGE_KEY = 'panini2026';

  // State: 0 = missing, 1 = have, 2+ = duplicate count
  let data = {};

  function load() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) data = JSON.parse(saved);
    } catch(e) { data = {}; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getStatus(n) {
    const v = data[n] || 0;
    if (v === 0) return 'miss';
    if (v === 1) return 'have';
    return 'dup';
  }

  function getDupCount(n) {
    return Math.max(0, (data[n] || 0) - 1);
  }

  function setStatus(n, v) {
    data[n] = v;
    save();
    updateSticker(n);
    updateStats();
  }

  // Build grid
  function buildGrid() {
    const grid = document.getElementById('stickerGrid');
    for (let i = 1; i <= TOTAL; i++) {
      const el = document.createElement('div');
      el.className = 'sticker';
      el.id = 'stk-' + i;
      el.dataset.num = i;
      el.addEventListener('click', () => openModal(i));
      grid.appendChild(el);
    }
    renderAll();
  }

  function updateSticker(n) {
    const el = document.getElementById('stk-' + n);
    if (!el) return;
    const status = getStatus(n);
    el.className = 'sticker ' + status;
    el.innerHTML = n;
    if (status === 'dup') {
      const cnt = getDupCount(n);
      el.innerHTML = n + '<span class="dup-count">+' + cnt + '</span>';
    }
    // apply search/filter visibility
    applyVisibility(el, n);
  }

  function renderAll() {
    for (let i = 1; i <= TOTAL; i++) updateSticker(i);
  }

  // Stats
  function updateStats() {
    let have = 0, miss = 0, dup = 0;
    for (let i = 1; i <= TOTAL; i++) {
      const v = data[i] || 0;
      if (v === 0) miss++;
      else if (v === 1) have++;
      else { have++; dup += v - 1; }
    }
    document.getElementById('statTotal').textContent = TOTAL;
    document.getElementById('statHave').textContent = have;
    document.getElementById('statMiss').textContent = miss;
    document.getElementById('statDup').textContent = dup;
    const pct = Math.round((have / TOTAL) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    updateCountLabel();
  }

  // Filter & search
  let currentFilter = 'all';
  let currentSearch = '';

  function matchesFilter(n) {
    const status = getStatus(n);
    if (currentFilter === 'all') return true;
    if (currentFilter === 'have') return status === 'have' || status === 'dup';
    if (currentFilter === 'miss') return status === 'miss';
    if (currentFilter === 'dup') return status === 'dup';
    return true;
  }

  function matchesSearch(n) {
    if (!currentSearch) return true;
    return String(n).includes(currentSearch);
  }

  function applyVisibility(el, n) {
    const visible = matchesFilter(n) && matchesSearch(n);
    el.classList.toggle('hidden', !visible);
  }

  function applyAllVisibility() {
    let visibleCount = 0;
    for (let i = 1; i <= TOTAL; i++) {
      const el = document.getElementById('stk-' + i);
      if (!el) continue;
      const visible = matchesFilter(i) && matchesSearch(i);
      el.classList.toggle('hidden', !visible);
      if (visible) visibleCount++;
    }
    const empty = document.getElementById('emptyState');
    empty.classList.toggle('visible', visibleCount === 0);
    updateCountLabel();
  }

  function updateCountLabel() {
    const label = document.getElementById('countLabel');
    if (currentFilter === 'all' && !currentSearch) {
      label.textContent = '';
      return;
    }
    let count = 0;
    for (let i = 1; i <= TOTAL; i++) {
      if (matchesFilter(i) && matchesSearch(i)) count++;
    }
    const filterNames = { all:'total', have:'que tenho', miss:'faltando', dup:'repetidas' };
    if (currentSearch) label.textContent = `${count} resultado(s) para "${currentSearch}"`;
    else label.textContent = `${count} figurinha(s) ${filterNames[currentFilter]}`;
  }

  // Filter tabs
  document.getElementById('filterTabs').addEventListener('click', e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    currentFilter = tab.dataset.filter;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.stat-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === currentFilter));
    applyAllVisibility();
  });

  // Stat chips as filters
  document.querySelectorAll('.stat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const f = chip.dataset.filter;
      currentFilter = f;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
      document.querySelectorAll('.stat-chip').forEach(c => c.classList.toggle('active', c === chip));
      applyAllVisibility();
    });
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', e => {
    currentSearch = e.target.value.trim();
    applyAllVisibility();
  });

  // MODAL
  let modalNum = null;

  function openModal(n) {
    modalNum = n;
    document.getElementById('modalNum').textContent = 'Figurinha #' + n;
    renderModalContent(n);
    document.getElementById('modalOverlay').classList.add('open');
  }

  function renderModalContent(n) {
    const status = getStatus(n);
    const cnt = document.getElementById('modalContent');

    if (status === 'miss') {
      cnt.innerHTML = `
        <div class="modal-actions">
          <button class="modal-btn green" id="mBtnHave">✓ Tenho!</button>
          <button class="modal-btn gold" id="mBtnDup">⭐ Tenho repetida</button>
        </div>`;
      cnt.querySelector('#mBtnHave').onclick = () => { setStatus(n, 1); closeModal(); showToast('Figurinha #' + n + ' marcada ✓'); };
      cnt.querySelector('#mBtnDup').onclick = () => { setStatus(n, 2); closeModal(); showToast('Figurinha #' + n + ' marcada como repetida ⭐'); };
    } else if (status === 'have') {
      cnt.innerHTML = `
        <div class="modal-actions three-col">
          <button class="modal-btn gold" id="mBtnAddDup">+1 Repetida</button>
          <button class="modal-btn red" id="mBtnRemove">✗ Remover</button>
          <button class="modal-btn" id="mBtnClose2" style="opacity:.5">Cancelar</button>
        </div>`;
      cnt.querySelector('#mBtnAddDup').onclick = () => { setStatus(n, 2); closeModal(); showToast('+1 repetida da #' + n); };
      cnt.querySelector('#mBtnRemove').onclick = () => { setStatus(n, 0); closeModal(); showToast('Figurinha #' + n + ' removida'); };
      cnt.querySelector('#mBtnClose2').onclick = closeModal;
    } else {
      // dup
      const dupCount = getDupCount(n);
      cnt.innerHTML = `
        <p style="text-align:center;font-size:.8rem;color:var(--text-muted);margin-bottom:.75rem">Repetidas</p>
        <div class="dup-counter">
          <button class="dup-counter-btn" id="mDupMinus">−</button>
          <span class="dup-counter-val" id="mDupVal">${dupCount}</span>
          <button class="dup-counter-btn" id="mDupPlus">+</button>
        </div>
        <div class="modal-actions">
          <button class="modal-btn red" id="mBtnRemove2">✗ Não tenho mais</button>
          <button class="modal-btn green" id="mBtnSave">Salvar</button>
        </div>`;

      let localDup = dupCount;
      const valEl = cnt.querySelector('#mDupVal');
      cnt.querySelector('#mDupMinus').onclick = () => { if (localDup > 1) { localDup--; valEl.textContent = localDup; } };
      cnt.querySelector('#mDupPlus').onclick = () => { localDup++; valEl.textContent = localDup; };
      cnt.querySelector('#mBtnSave').onclick = () => { setStatus(n, 1 + localDup); closeModal(); showToast('Figurinha #' + n + ': ' + localDup + ' repetida(s)'); };
      cnt.querySelector('#mBtnRemove2').onclick = () => { setStatus(n, 0); closeModal(); showToast('Figurinha #' + n + ' removida'); };
    }
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    modalNum = null;
  }

  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });

  // TOAST
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // RESET
  document.getElementById('resetBtn').onclick = () => document.getElementById('resetConfirm').classList.add('open');
  document.getElementById('resetCancel').onclick = () => document.getElementById('resetConfirm').classList.remove('open');
  document.getElementById('resetConfirmBtn').onclick = () => {
    data = {};
    save();
    renderAll();
    updateStats();
    document.getElementById('resetConfirm').classList.remove('open');
    showToast('Dados resetados!');
  };

  // EXPORT
  document.getElementById('exportBtn').onclick = () => {
    const json = JSON.stringify({ version: 1, album: 'panini2026', data }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'figurinhas-panini2026.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Dados exportados!');
  };

  // IMPORT
  document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed.data) {
          data = parsed.data;
        } else {
          data = parsed;
        }
        save();
        renderAll();
        updateStats();
        showToast('Dados importados com sucesso!');
      } catch(err) {
        showToast('Erro ao importar arquivo');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // INIT
  load();
  buildGrid();
  updateStats();
</script>
</body>
</html>
